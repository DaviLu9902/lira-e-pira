function txt(s,x,y,c='#fff',sc=1,al='left'){
  s=String(s).toUpperCase();
  const w=s.length*6*sc-sc;
  const sx=al==='center'?x-w/2:al==='right'?x-w:x;
  for(const pass of [1,0]){
    ctx.fillStyle=pass?'#000':c;
    const ox=pass?sc:0;
    for(let i=0;i<s.length;i++){
      const g=FONT[s[i]]||FONT['?'];
      for(let r=0;r<7;r++){
        const row=g[r];
        for(let k=0;k<5;k++)if(row[k]==='#')ctx.fillRect(Math.round(sx+i*6*sc+k*sc+ox),Math.round(y+r*sc+ox),sc,sc);
      }
    }
  }
}

let actx=null,master=null;
function audioInit(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.connect(actx.destination);updateVol();
  }catch(e){actx=null;}
}
function updateVol(){if(master)master.gain.value=vol/10*0.15;}
function beep(f,d,type,f2){
  if(!actx||vol===0)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.5,t);
  g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g);g.connect(master);
  o.start(t);o.stop(t+d);
}

/* ---------- GERAÇÃO DE FASES ---------- */
function genLevel(n){
  if(n%TOTAL===0)return genBoss();
  const d=Math.min(1,(n-1)/(TOTAL-1)),len=Math.min(220,60+Math.round(n*3.5)),m=diff?1.5:1;
  const g=Array.from({length:14},()=>new Array(len).fill(0));
  const enemies=[],coins=[],pitP=(0.01+d*0.08)*m,enP=(0.02+d*0.14)*m;
  let pit=0;
  for(let x=0;x<len;x++){
    if(x<10||x>=len-12){g[12][x]=g[13][x]=1;continue;}
    if(pit>0){pit--;continue;}
    if(Math.random()<pitP){pit=(d>0.5&&Math.random()<0.5)?2:1;continue;}
    g[12][x]=g[13][x]=1;
  }
  let x=12;
  while(x<len-16){
    const r=Math.random();
    if(r<0.12){
      const w=1+Math.floor(Math.random()*3);
      for(let k=0;k<w;k++)g[8][x+k]=3;
      x+=w+3;
    }else if(r<0.24){
      const w=3+Math.floor(Math.random()*3);
      for(let k=0;k<w;k++)g[10][x+k]=2;
      x+=w+2;
    }else if(r<0.34){
      for(let k=0;k<4;k++)coins.push({x:(x+k)*T+4,y:172,got:false});
      x+=6;
    }else x++;
  }
  for(let i=14;i<len-16;i++){
    if(g[12][i]&&g[12][i-1]&&g[12][i+1]&&Math.random()<enP)
      enemies.push({x:i*T+2,y:180,w:12,h:12,vx:0,vy:0,dir:-1,dead:false,flat:0});
  }
  return {boss:false,w:len,g,enemies,coins,flagX:(len-8)*T,brk:{}};
}
function genBoss(){
  const w=40,g=Array.from({length:14},()=>new Array(w).fill(0));
  for(let x=0;x<w;x++){
    const dx=x+0.5-20,s=81-dx*dx;
    if(s<0)continue;
    const top=Math.ceil(18-Math.sqrt(s));
    for(let y=Math.max(0,top);y<14;y++)g[y][x]=1;
  }
  return {boss:true,w,g,enemies:[],coins:[],flagX:1e9,brk:{}};
}
function makeBoss(){
  return {x:20*T-18,y:60,w:36,h:36,vx:0,vy:0,onGround:false,hp:diff?10:8,max:diff?10:8,inv:0,
    cool:diff?110:150,grab:null,gt:0,dead:false,dying:0,flash:0};
}

/* ---------- FÍSICA ---------- */
function physics(e,grav,maxF){
  e.vy=Math.min(e.vy+grav,maxF);
  let hitX=false,landed=null;
  if(e.vx){
    e.x+=e.vx;
    const tx=e.vx>0?Math.floor((e.x+e.w-1)/T):Math.floor(e.x/T);
    for(let ty=Math.floor(e.y/T);ty<=Math.floor((e.y+e.h-1)/T);ty++){
      if(solid(tx,ty)){e.x=e.vx>0?tx*T-e.w:(tx+1)*T;e.vx=0;hitX=true;break;}
    }
  }
  e.y+=e.vy;e.onGround=false;
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-1)/T);
  if(e.vy>=0){
    const ty=Math.floor((e.y+e.h)/T);
    for(let tx=x0;tx<=x1;tx++){
      if(solid(tx,ty)){e.y=ty*T-e.h;e.vy=0;e.onGround=true;landed=[tx,ty];break;}
    }
  }else{
    const ty=Math.floor(e.y/T);
    for(let tx=x0;tx<=x1;tx++){
      if(solid(tx,ty)){e.y=(ty+1)*T;e.vy=0;break;}
    }
  }
  return {hitX,landed};
}

/* ---------- ENTRADA ---------- */
function menuCode(c){
  if(['ArrowUp','KeyW'].includes(c))return 'up';
  if(['ArrowDown','KeyS'].includes(c))return 'down';
  if(['ArrowLeft','KeyA'].includes(c))return 'left';
  if(['ArrowRight','KeyD'].includes(c))return 'right';
  if(['Enter','Space','KeyZ'].includes(c))return 'ok';
  if(c==='Escape')return 'back';
  return null;
}
addEventListener('keydown',e=>{
  audioInit();
  if(state==='text')return;
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
  held.add(c);
  if(e.repeat)return;
  if(state==='select'&&coop){
    const map={KeyA:'p1L',KeyD:'p1R',KeyW:'p1OK',ArrowLeft:'p2L',ArrowRight:'p2R',ArrowUp:'p2OK',Escape:'back'};
    if(map[c])menuQ.push(map[c]);
    return;
  }
  KEYS.forEach((k,i)=>{if(k.J.includes(c))jumpQ[i]=true;});
  if(c==='Escape'||c==='KeyP'){
    if(state==='play'){openPause();return;}
    if(state==='pause'&&c==='KeyP'){resumeGame();return;}
  }
  const m=menuCode(c);
  if(m)menuQ.push(m);
});
addEventListener('keyup',e=>held.delete(e.code));
ti.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();menuQ.push('textok');}

function bindBtn(id,fn,act){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();fn(true);menuQ.push(act);});
  const off=e=>{e.preventDefault();fn(false);};
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);

}

function padEdge(k,i){
  const s=nP===1?0:i;
  switch(k){
    case 'A':jumpQ[s]=true;menuQ.push('ok');break;
    case 'B':menuQ.push('back');break;
    case 'S':if(state==='play')openPause();else if(state==='pause')resumeGame();break;
    case 'U':menuQ.push('up');break;
    case 'D':menuQ.push('down');break;
    case 'LF':menuQ.push('left');break;
    case 'RT':menuQ.push('right');break;
  }
}
function pollPads(){
  let list=[];
  try{list=navigator.getGamepads?navigator.getGamepads():[];}catch(e){list=[];}
  const gps=[];
  for(const g of list)if(g)gps.push(g);
  for(let i=0;i<2;i++){
    const gp=gps[i];
    if(!gp){pads[i]={L:false,R:false};padPrev[i]={};continue;}
    const b=gp.buttons,a=gp.axes,pr=k=>!!(b[k]&&b[k].pressed);
    const cur={A:pr(0),B:pr(1),S:pr(9),U:pr(12)||a[1]<-0.5,D:pr(13)||a[1]>0.5,LF:pr(14)||a[0]<-0.5,RT:pr(15)||a[0]>0.5};
    pads[i]={L:cur.LF,R:cur.RT};
    const pv=padPrev[i];
    for(const k in cur)if(cur[k]&&!pv[k])padEdge(k,i);
    padPrev[i]=cur;
  }
}
function inputFor(i){
  // jogador 2 da partida online vem da rede
  if(net.role==='host'&&i===1){
    const j=remoteJ;remoteJ=false;
    return {l:remoteL,r:remoteR,j};
  }
  let sets;
  if(i===0){
    if(nP===1||net.role==='host')sets=[0,1];
    else sets=[1];           // co-op local: P1 usa WASD
  }else{
    sets=[0];                // P2 usa setas
  }
  let l=false,r=false,j=false;
  for(const s of sets){
    const k=KEYS[s];
    if(k.L.some(c=>held.has(c)))l=true;
    if(k.R.some(c=>held.has(c)))r=true;
    if(jumpQ[s]){j=true;jumpQ[s]=false;}
  }
  if(i===0){if(touch.l)l=true;if(touch.r)r=true;}
  const pl=(i===0&&nP===1)?[pads[0],pads[1]]:[pads[i]];
  for(const q of pl){if(q.L)l=true;if(q.R)r=true;}
  return {l,r,j};
}

/* ---------- JOGADORES ---------- */
function setBig(p,b){
  if(b===p.big)return;
  if(b){p.big=true;p.h=26;p.y-=10;}
  else{p.big=false;p.h=16;p.y+=10;}
}
function hurt(p){
  if(p.inv>0)return;
  SFX.hurt();
  if(p.big){setBig(p,false);p.inv=90;}
  else die(p);
}
function respawnBoxes(){
  if(!L||nP!==2)return;
  for(const k in L.brk){
    const r=L.brk[k];
    if(r.broken&&r.rs<1){
      L.g[r.ty][r.tx]=3;r.broken=false;r.rs++;
      if(net.role==='host')net.gr.push([r.tx,r.ty]);
    }
  }
}
function die(p){
  if(p.dead||p.out)return;
  respawnBoxes();
  p.lives--;setBig(p,false);p.mega=false;p.vx=0;p.vy=0;
  if(p.lives<=0){p.out=true;p.lives=0;}
  else{p.dead=true;p.respawnT=100;}
}
function bossThrowHit(p){
  if(p.inv>0)return;
  SFX.hurt();
  p.lives-=0.5;
  popup(CHARS[p.ch].name+' -0.5 VIDA',CHARS[p.ch].shirt);
  if(p.lives<=0){p.lives=0;p.out=true;}
}
function respawn(p){
  const o=players.find(q=>q!==p&&!q.out&&!q.dead);
  p.x=o?o.x:(L.boss?17*T:4*T);
  p.y=gY(p);p.vx=0;p.vy=0;p.onGround=false;p.dead=false;p.inv=120;
}
function popup(t,c){
  popups.push({t,c,life:120});
  if(popups.length>3)popups.shift();
}
function breakBox(tx,ty,p){
  L.g[ty][tx]=0;
  const key=tx+','+ty;
  const rec=L.brk[key]||(L.brk[key]={tx,ty,rs:0});
  rec.broken=true;
  if(net.role==='host')net.gb.push([tx,ty]);
  SFX.brk();
  const nm=CHARS[p.ch].name,col=CHARS[p.ch].shirt,r=Math.floor(Math.random()*5);
  if(r===0){
    p.lives++;SFX.item();
    popup(nm+' +1 VIDA',col);
  }else if(r===1){
    const was=p.big;setBig(p,true);SFX.item();
    popup(was?nm+' MEDALHA (JÁ MAIOR)':nm+' MEDALHA: CRESCE',col);
  }else{
    const n=r===2?5:r===3?10:20;
    p.coins+=n;SFX.coin();
    popup(nm+' +'+n+' MOEDAS',col);
    if(p.coins>=100){p.coins-=100;p.lives++;popup(nm+' +1 VIDA (100 MOEDAS)',col);}
  }
}
function updatePlayer(p,i){
  if(p.dead){if(--p.respawnT<=0)respawn(p);return;}
  if(p.done){p.pb=p.y+p.h;return;}
  p.pb=p.y+p.h;
  if(p.inv>0)p.inv--;
  if(p.held)return;
  const inp=inputFor(i);
  const dir=(inp.r?1:0)-(inp.l?1:0);
  if(dir)p.facing=dir;
  p.vx=p.onGround?dir*2.2:p.vx+(dir*2.2-p.vx)*0.12;
  if(p.onGround)p.coy=6;else if(p.coy>0)p.coy--;
  if(inp.j){
    if(p.onGround||p.coy>0){p.vy=-5;p.onGround=false;p.coy=0;p.lastJump=frame;p.megaUsed=false;SFX.jump();if(mode==='tut')tutN++;}
    else if(!p.megaUsed&&frame-p.lastJump<=16){p.vy=-7.2;p.mega=true;p.megaUsed=true;SFX.mega();if(mode==='tut')tutM++;}
  }
  const wasMega=p.mega;
  const r=physics(p,0.32,6);
  if(r.landed){
    const [tx,ty]=r.landed;
    if(wasMega&&L.g[ty][tx]===3)breakBox(tx,ty,p);
    p.mega=false;p.megaUsed=false;
  }
  if(p.y>216)die(p);
}

/* ---------- MOEDAS E INIMIGOS ---------- */
function collectCoins(){
  for(const c of L.coins){
    if(c.got)continue;
    for(const p of players){
      if(p.out||p.dead||p.held||p.done)continue;
      if(ov(p,{x:c.x,y:c.y,w:8,h:8})){
        c.got=true;p.coins++;SFX.coin();
        if(p.coins>=100){p.coins-=100;p.lives++;popup(CHARS[p.ch].name+' +1 VIDA (100 MOEDAS)',CHARS[p.ch].shirt);}
        break;
      }
    }
  }
}
function updateEnemies(){
  for(const e of L.enemies){
    if(e.dead){e.flat--;continue;}
    e.vx=e.dir*0.5;
    if(physics(e,0.32,6).hitX)e.dir*=-1;
    if(e.y>216){e.dead=true;e.flat=0;continue;}
    for(const p of players){
      if(p.out||p.dead||p.held||p.done||e.dead||!ov(p,e))continue;
      if(p.vy>0&&p.pb<=e.y+5){e.dead=true;e.flat=30;p.vy=-4.2;p.onGround=false;SFX.stomp();}
      else hurt(p);
    }
  }
  L.enemies=L.enemies.filter(e=>!e.dead||e.flat>0);
}

/* ---------- CHEFE ---------- */
function updateBoss(){
  const b=boss;
  if(b.dead){if(--b.dying<=0){clearing=true;clearT=200;}return;}
  if(b.inv>0)b.inv--;
  if(b.flash>0)b.flash--;
  if(megaTipT>0)megaTipT--;
  const act=players.filter(p=>!p.out&&!p.dead&&!p.held);
  if(b.grab){
    const p=b.grab;
    p.x=b.x+b.w/2-p.w/2;p.y=b.y-p.h+4;p.vx=0;p.vy=0;
    if(--b.gt<=0){
      p.held=false;b.grab=null;
      p.vx=(p.x+p.w/2<b.x+b.w/2?-1:1)*3;p.vy=-7.5;p.onGround=false;
      p.inv=0;bossThrowHit(p);p.inv=50;b.cool=diff?110:150;
    }
    b.vx=0;
  }else{
    b.cool--;
    let tg=null,best=1e9;
    for(const p of act){const d=Math.abs(p.x-b.x);if(d<best){best=d;tg=p;}}
    if(tg){
      const dx=(tg.x+tg.w/2)-(b.x+b.w/2);
      b.vx=Math.abs(dx)>8?Math.sign(dx)*0.8:0;
      if(b.cool<=0&&Math.abs(dx)<24&&Math.abs(tg.y-b.y)<28){
        b.grab=tg;b.gt=70;tg.held=true;tg.vx=0;tg.vy=0;b.vx=0;SFX.boss();
      }
    }else b.vx=0;
  }
  physics(b,0.32,6);
  if(b.y>216){b.x=20*T-18;b.y=60;b.vy=0;}
  for(const p of act){
    if(p.held||!ov(p,b))continue;
    if(p.vy>0&&p.pb<=b.y+8){
      if(p.mega&&b.inv<=0){
        p.vy=-7;p.onGround=false;
        b.hp--;b.inv=50;b.flash=12;SFX.stomp();
        popup('GOLPE! '+b.hp+' RESTANTES',CHARS[p.ch].shirt);
        if(b.hp<=0){b.dead=true;b.dying=150;}
      }else{
        p.vy=-6;p.onGround=false;
        if(megaTipT<=0){popup('USE MEGA PULO: PULE 2X',"#ffd23f");megaTipT=180;}
      }
    }else if(!b.grab&&p.inv<=0){
      b.grab=p;b.gt=70;p.held=true;p.vx=0;p.vy=0;SFX.boss();
    }
  }
}

/* ---------- FLUXO ---------- */
function resetPlayers(){
  players=[];
  for(let i=0;i<nP;i++){
    players.push({i,ch:CH[i],x:0,y:0,w:10,h:16,vx:0,vy:0,onGround:false,big:false,
      lives:5,coins:0,dead:false,out:false,respawnT:0,inv:0,mega:false,megaUsed:false,
      lastJump:-99,coy:0,facing:1,held:false,pb:0});
  }
}
function startMode(m,n){
  mode=m;
  resetPlayers();
  popups=[];
  loadLevel(n);
  state='play';
  if(net.role==='host'&&net.conn)net.conn.send({t:'start'});
}
function loadLevel(n){
  lvl=n;
  L=genLevel(n);
  boss=L.boss?makeBoss():null;
  curTheme=themeSel===4?THEMES[Math.floor(Math.random()*THEMES.length)]:THEMES[themeSel];
  clearing=false;paused=false;megaTipT=0;
  for(const p of players){
    if(p.out)continue;
    p.dead=false;p.done=false;p.held=false;p.vx=0;p.vy=0;p.mega=false;p.megaUsed=false;p.coy=0;
    p.onGround=false;p.inv=60;p.x=(L.boss?17*T:4*T)+p.i*14;p.y=gY(p);
  }
  camX=0;introT=100;
  bossMsg=!!L.boss&&mode!=='tut';if(bossMsg)introT=0;
  net.gb=[];net.gr=[];
  if(net.role==='host'&&net.conn)net.conn.send({t:'lv',n,boss:!!L.boss,w:L.w,g:L.g,flagX:L.flagX,
    coins:L.coins.map(c=>({x:c.x,y:c.y})),th:THEMES.indexOf(curTheme),md:mode});
}
function genTut(){
  const w=40,g=Array.from({length:14},()=>new Array(w).fill(0));
  for(let x=0;x<w;x++){g[12][x]=1;g[13][x]=1;}
  g[8][22]=3;g[8][23]=3;
  return {boss:false,w,g,enemies:[],coins:[],flagX:1e9,brk:{},tut:true};
}
function startTutorial(){
  mode='tut';nP=1;CH[0]=0;
  resetPlayers();popups=[];
  loadLevel(1);
  L=genTut();boss=null;bossMsg=false;
  for(const p of players){p.x=4*T;p.y=gY(p);}
  introT=0;tutStep=0;tutN=0;tutM=0;tutT=0;
  state='play';
}
function tutUpdate(){
  tutT++;
  if(tutStep===0&&tutN>0){tutStep=1;tutT=0;}
  else if(tutStep===1&&tutM>0){tutStep=2;tutT=0;}
  else if(tutStep===2&&(L.g[8][22]===0||L.g[8][23]===0)){tutStep=3;tutT=0;}
}
function nextLevel(){
  if(mode!=='inf'&&lvl>=TOTAL){state='win';endT=900;return;}
  if(mode==='sel'){state='levels';clearing=false;return;}
  loadLevel(lvl+1);
}
function updatePlay(){
  if(mode==='tut')tutUpdate();
  if(players.every(p=>p.out)){state='over';endT=240;return;}
  for(let i=0;i<players.length;i++){
    const p=players[i];
    if(!p.out)updatePlayer(p,i);
  }
  updateEnemies();
  collectCoins();
  if(boss)updateBoss();
  if(!boss&&!clearing){
    for(const p of players){
      if(!p.out&&!p.done&&!p.dead&&p.x+p.w>=L.flagX){p.done=true;p.vx=0;SFX.item();}
    }
    const pend=players.filter(p=>!p.out&&!p.done);
    if(pend.length===0&&players.some(p=>!p.out)){clearing=true;clearT=150;}
  }

}
function adjustOpt(d){
  if(optFromPause&&optRow!==0)return;
  if(optRow===0){vol=Math.max(0,Math.min(10,vol+d));updateVol();}
  else if(optRow===1){themeSel=(themeSel+d+5)%5;}
  else if(optRow===2){diff=diff?0:1;}
}
function openPause(){
  if(state!=='play')return;
  state='pause';pauseSel=0;
}
function resumeGame(){state='play';}
function quitToMenu(){
  if(net.role)leaveNet('');
  state='title';net.msg='';msgT=0;
}
function optMove(d){
  const list=optFromPause?[0,3]:[0,1,2,3];
  let i=list.indexOf(optRow);
  if(i<0)i=0;
  optRow=list[Math.max(0,Math.min(list.length-1,i+d))];
}
function optBack(){
  if(optFromPause){state='pause';optFromPause=false;}
  else state='title';
}
function toggleFS(){
  if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();return;}
  const el=document.documentElement;
  const p=el.requestFullscreen?el.requestFullscreen():null;
  if(p&&p.catch)p.catch(()=>{net.msg='TELA CHEIA NÃO DISPONÍVEL NESTE NAVEGADOR';msgT=180;});
  else{net.msg='TELA CHEIA NÃO DISPONÍVEL NESTE NAVEGADOR';msgT=180;}
}

function openText(label,secret,onOk,backState){
  tmode={label,secret,onOk,back:backState};

/* ---------- REDE (PeerJS / WebRTC) ---------- */
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,30);}
function netAvailable(){return typeof Peer!=='undefined';}
function leaveNet(msg){
  try{if(net.conn)net.conn.close();}catch(e){}
  try{if(net.peer)net.peer.destroy();}catch(e){}
  net.conn=null;net.peer=null;net.role=null;net.snap=null;net.guestPick=null;
  net.msg=msg||'';msgT=240;
  state='net';
}
function remoteIn(m){
  remoteL=!!m.l;remoteR=!!m.r;
  if(m.j)remoteJ=true;
}
function hostCreate(code,pw){
  const id='liraepira-'+slug(code);
  net.role='host';net.pw=pw;net.room=code;net.guestPick=null;
  state='lobby';net.msg='CRIANDO PARTIDA...';msgT=9999;
  const peer=new Peer(id);
  net.peer=peer;
  peer.on('open',()=>{net.msg='';msgT=0;});
  peer.on('error',err=>{
    leaveNet(err.type==='unavailable-id'?'CÓDIGO EM USO, ESCOLHA OUTRO':'ERRO DE CONEXÃO: '+err.type);
  });
  peer.on('connection',conn=>{
    if(net.conn){conn.close();return;}
    conn.on('data',m=>{
      if(m.t==='join'){
        if(m.pw===net.pw&&!net.conn){
          net.conn=conn;conn.send({t:'ok'});
          conn.on('close',()=>{if(net.conn===conn){net.conn=null;onHostPeerLeft();}});
        }else{conn.send({t:'bad'});setTimeout(()=>conn.close(),300);}
      }else if(m.t==='in'&&net.conn===conn){remoteIn(m);}
      else if(m.t==='p2'&&net.conn===conn){net.guestPick=m.ch;}
    });
  });
}
function onHostPeerLeft(){
  remoteL=remoteR=remoteJ=false;
  net.guestPick=null;
  if(state==='play'||state==='over'||state==='win'||state==='levels'){
    state='lobby';paused=false;net.msg='JOGADOR 2 SAIU';msgT=240;
  }else if(state!=='net'&&state!=='title'){
    state='lobby';net.msg='JOGADOR 2 SAIU';msgT=240;
  }
}
function joinRoom(code,pw){
  const id='liraepira-'+slug(code);
  net.role='guest';net.pw=pw;net.room=code;
  state='wait';net.msg='CONECTANDO...';msgT=9999;
  const peer=new Peer();
  net.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(id,{reliable:true});
    net.conn=conn;
    conn.on('open',()=>conn.send({t:'join',pw}));
    conn.on('data',onGuestMsg);
    conn.on('close',()=>{if(net.role==='guest')leaveNet('CONEXÃO PERDIDA');});
  });
  peer.on('error',err=>{
    leaveNet(err.type==='peer-unavailable'?'PARTIDA NÃO ENCONTRADA':'ERRO DE CONEXÃO: '+err.type);
  });
}
function onGuestMsg(m){
  if(m.t==='ok'){state='wait';net.msg='CONECTADO! AGUARDANDO O ANFITRIÃO';msgT=9999;}
  else if(m.t==='bad'){leaveNet('SENHA ERRADA OU PARTIDA CHEIA');}
  else if(m.t==='p1'){net.hostCh=m.ch;gc=1-m.ch;state='gsel';net.msg='';}
  else if(m.t==='start'){state='play';nP=2;paused=false;}
  else if(m.t==='lv'){
    L={boss:m.boss,w:m.w,g:m.g,flagX:m.flagX,coins:m.coins.map(c=>({x:c.x,y:c.y,got:false})),enemies:[]};
    curTheme=THEMES[m.th];lvl=m.n;mode=m.md;
  }
  else if(m.t==='st'){net.snap=m;}
}
function sendInput(){
  if(!net.conn||!net.conn.open)return;
  const l=KEYS[0].L.some(c=>held.has(c))||touch.l||pads[0].L;
  const r=KEYS[0].R.some(c=>held.has(c))||touch.r||pads[0].R;
  const j=jumpQ[0];jumpQ[0]=false;
  net.conn.send({t:'in',l,r,j});
}
function snapshot(){
  return {t:'st',st:state,md:mode,lvl,cx:camX,ic:introT,bm:bossMsg,cl:clearing,ct:clearT,
    p:players.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,w:p.w,h:p.h,ch:p.ch,big:p.big,lives:p.lives,coins:p.coins,
      dead:p.dead,out:p.out,done:p.done,inv:p.inv,held:p.held,mega:p.mega,f:p.facing})),
    e:L?L.enemies.map(e=>({x:e.x,y:e.y,dead:e.dead,flat:e.flat})):[],
    c:L?L.coins.map(c=>c.got):[],
    b:boss?{x:boss.x,y:boss.y,hp:boss.hp,max:boss.max,inv:boss.inv,flash:boss.flash,dead:boss.dead,dying:boss.dying}:null,
    po:popups.map(p=>({t:p.t,c:p.c,l:p.life})),
    gb:net.gb.splice(0),gr:net.gr.splice(0)
  };
}
function applySnap(s){
  if(s.st==='title'){leaveNet('ANFITRIÃO VOLTOU AO MENU');return;}
  if(!['play','over','win','levels'].includes(s.st))return;
  state=s.st;mode=s.md;lvl=s.lvl;introT=s.ic;bossMsg=!!s.bm;clearing=s.cl;clearT=s.ct;
  players=s.p.map((q,i)=>Object.assign({i,pb:0,megaUsed:false,coy:0,lastJump:-99},q));
  if(L){
    L.enemies=s.e;
    s.c.forEach((g,i)=>{if(L.coins[i])L.coins[i].got=g;});
    (s.gb||[]).forEach(([tx,ty])=>{L.g[ty][tx]=0;});
    (s.gr||[]).forEach(([tx,ty])=>{L.g[ty][tx]=3;});
  }
  boss=s.b?Object.assign({grab:null,w:36,h:36},s.b):null;
  popups=s.po.map(p=>({t:p.t,c:p.c,life:p.l}));
}

/* ---------- ATUALIZAÇÃO ---------- */
function update(){
  frame++;
  pollPads();
  const acts=menuQ.splice(0);
  popups.forEach(p=>p.life--);
  popups=popups.filter(p=>p.life>0);
  if(msgT>0&&msgT<9999)msgT--;
  if(state!=='play'&&state!=='wait')jumpQ.fill(false);
  for(const a of acts){
    if(a==='pausebtn'){
      if(state==='play')openPause();
      else if(state==='pause')resumeGame();
    }
  }

  if(net.role==='guest'){
    if(state==='wait'||state==='play'||state==='over'||state==='win'||state==='levels'){
      sendInput();
      if(net.snap){const s=net.snap;net.snap=null;if(state!=='wait'||s.st!=='title')applySnap(s);}
      return;
    }
  }

  if(state==='text'){
    for(const a of acts){
      if(a==='back'){state=tmode.back;ti.blur();net.msg='';break;}
      if(a==='textok'||a==='ok'){
        const v=ti.value.trim();
        if(!v){net.msg='DIGITE ALGO';msgT=120;}
        else{ti.blur();tmode.onOk(v);}
        break;
      }
    }
    return;
  }
  if(state==='ask'){
    for(const a of acts){
      if(a==='left')askSel=0;
      else if(a==='right')askSel=1;
      else if(a==='ok'){if(askSel===0)startTutorial();else state='title';break;}
      else if(a==='back'){state='title';break;}
    }
    return;
  }
  if(state==='title'){
    for(const a of acts){
      if(a==='up'||a==='left')mode_=Math.max(0,mode_-1);
      else if(a==='down'||a==='right')mode_=Math.min(TITLE_OPTS.length-1,mode_+1);
      else if(a==='ok'){
        if(mode_===0){nP=1;coop=false;d1=false;c1=0;selMsg='';state='select';}
        else if(mode_===1){
          if(TOUCH){net.msg='CO-OP LOCAL SÓ NO PC';msgT=180;}
          else{nP=2;coop=true;d1=false;d2=false;c1=0;c2=1;selMsg='';state='select';}
        }
        else if(mode_===2){state='net';netOpt=0;net.msg='';}
        else if(mode_===3){state='options';optRow=0;optFromPause=false;}
        else toggleFS();
      }
    }
    return;
  }
  if(state==='net'){
    for(const a of acts){
      if(a==='back')state='title';
      else if(a==='up'||a==='left')netOpt=Math.max(0,netOpt-1);
      else if(a==='down'||a==='right')netOpt=Math.min(NET_OPTS.length-1,netOpt+1);
      else if(a==='ok'){netStart(netOpt);return;}
    }
    return;
  }
  if(state==='lobby'){
    if(net.conn){state='select';nP=2;coop=false;pick0Reset();net.msg='';}
    for(const a of acts){
      if(a==='back'){try{net.peer&&net.peer.destroy();}catch(e){}net.peer=null;net.role=null;state='net';net.msg='';}
    }
    return;
  }
  if(state==='hwait'){
    if(net.guestPick!==null){
      CH[1]=net.guestPick;
      state='modes';modeOpt=0;
    }
    for(const a of acts){if(a==='back'){/* não cancela enquanto espera */}}
    return;
  }
  if(state==='gsel'){
    for(const a of acts){
      if(a==='left')gc=0;
      else if(a==='right')gc=1;
      else if(a==='back'){leaveNet('');}
      else if(a==='ok'){
        if(gc===net.hostCh){net.msg='ESSE PERSONAGEM JÁ FOI ESCOLHIDO';msgT=150;}
        else{
          net.conn.send({t:'p2',ch:gc});
          state='wait';net.msg='AGUARDANDO O ANFITRIÃO COMEÇAR';msgT=9999;
        }
      }
    }
    return;
  }
  if(state==='pause'){
    for(const a of acts){
      if(a==='back'){resumeGame();break;}
      else if(a==='up'||a==='left')pauseSel=Math.max(0,pauseSel-1);
      else if(a==='down'||a==='right')pauseSel=Math.min(3,pauseSel+1);
      else if(a==='ok'){
        if(pauseSel===0)resumeGame();
        else if(pauseSel===1)quitToMenu();
        else if(pauseSel===2)toggleFS();
        else{state='options';optRow=0;optFromPause=true;}
        break;
      }
    }
    return;
  }
  if(state==='options'){
    for(const a of acts){
      if(a==='back'||(a==='ok'&&optRow===3)){optBack();break;}
      else if(a==='up')optMove(-1);
      else if(a==='down')optMove(1);
      else if(a==='left')adjustOpt(-1);
      else if(a==='right')adjustOpt(1);
      else if(a==='ok')optMove(1);
    }
    return;
  }
  if(state==='select'){
    if(coop){
      for(const a of acts){
        if(a==='back'){state='title';}
        else if(a==='p1L'&&!d1)c1=0;
        else if(a==='p1R'&&!d1)c1=1;
        else if(a==='p1OK'&&!d1){d1=true;selMsg='';}
        else if(a==='p2L'&&d1&&!d2)c2=0;
        else if(a==='p2R'&&d1&&!d2)c2=1;
        else if(a==='p2OK'&&d1){
          if(c2===c1){selMsg='ESSE PERSONAGEM JÁ FOI ESCOLHIDO';}
          else{d2=true;CH[0]=c1;CH[1]=c2;state='modes';modeOpt=0;selMsg='';return;}
        }
      }
      return;
    }
    for(const a of acts){
      if(a==='left')CH[0]=0;
      else if(a==='right')CH[0]=1;
      else if(a==='back'){if(net.role==='host')leaveNet('');state='title';}
      else if(a==='ok'){
        if(net.role==='host'){
          net.conn.send({t:'p1',ch:CH[0]});
          nP=2;state='hwait';net.msg='';
        }else{state='modes';modeOpt=0;}
        return;
      }
    }
    return;
  }
  if(state==='modes'){
    for(const a of acts){
      if(a==='back'){state=(net.role==='host'||coop)?'select':'select';}
      else if(a==='up'||a==='left')modeOpt=Math.max(0,modeOpt-1);
      else if(a==='down'||a==='right')modeOpt=Math.min(2,modeOpt+1);
      else if(a==='ok'){
        if(modeOpt===0)startMode('hist',1);
        else if(modeOpt===1)startMode('inf',1);
        else{state='levels';selL=0;}
        return;
      }
    }
    return;
  }
  if(state==='levels'){
    for(const a of acts){
      if(a==='back')state='modes';
      else if(a==='left')selL=Math.max(0,selL-1);
      else if(a==='right')selL=Math.min(TOTAL-1,selL+1);
      else if(a==='up')selL=Math.max(0,selL-10);
      else if(a==='down')selL=Math.min(TOTAL-1,selL+10);
      else if(a==='ok'){startMode('sel',selL+1);return;}
    }
    return;
  }
  if(state==='play'){
    if(mode==='tut'&&tutStep===3&&tutT>40&&acts.includes('ok')){state='title';return;}
    if(bossMsg){if(acts.includes('ok'))bossMsg=false;return;}
    if(introT>0){introT--;return;}
    if(clearing){if(--clearT<=0)nextLevel();return;}
    updatePlay();
    return;
  }
  if(--endT<=0||acts.includes('ok'))state='title';
}
function pick0Reset(){CH[0]=0;}
function netStart(i){
  if(!netAvailable()){net.msg='CONEXÃO INDISPONÍVEL NESTA PÁGINA';msgT=240;return;}
  if(i<2){
    openText('CÓDIGO DA PARTIDA:',false,code=>{
      openText('CRIE UMA SENHA:',true,pw=>hostCreate(code,pw),'net');
    },'net');
  }else{
    openText('CÓDIGO DA PARTIDA:',false,code=>{
      openText('SENHA DA PARTIDA:',true,pw=>joinRoom(code,pw),'net');
    },'net');
  }
}

function cloud(x,y){rc(x,y+4,24,8,'#fff');rc(x+4,y,16,6,'#fff');rc(x+8,y-3,8,4,'#fff');}
function hill(x,y,r,c){
  for(let k=0;k<=r;k++){
    const hw=Math.round(Math.sqrt(r*r-(r-k)*(r-k)));
    rc(x-hw,y-k,hw*2,1,c);
  }
}

function drawTiles(){
  const th=curTheme;

  for(const p of players){
    if(p.out||p.dead)continue;
    if(p.inv>0&&(frame>>2)%2===0)continue;
    drawChar(Math.round(p.x-camX)-1,Math.round(p.y),CHARS[p.ch],p.big);
  }
}
// câmera: cada jogador tem a sua; cada tela segue o próprio personagem
function camFor(p,vw){return Math.max(0,Math.min(L.w*T-vw,p.x+p.w/2-vw/2));}
let splitOn=false;
function viewports(){
  const alive=players.filter(p=>!p.out);
  const doneAny=players.some(p=>p.done);
  if(!net.role&&nP===2&&alive.length===2&&!doneAny){
    // co-op local: tela só se divide quando os jogadores se afastam muito
    const d=Math.abs(players[0].x-players[1].x);
    if(splitOn&&d<150)splitOn=false;
    else if(!splitOn&&d>200)splitOn=true;
    if(splitOn)return players.map((p,i)=>({x:i*128,w:128,cam:camFor(p,128)}));
    const mid=(players[0].x+players[0].w/2+players[1].x+players[1].w/2)/2;
    return [{x:0,w:W,cam:Math.max(0,Math.min(L.w*T-W,mid-W/2))}];
  }
  splitOn=false;
  let p=null;
  if(net.role){
    const mine=players[net.role==='guest'?1:0]||players[0];
    p=(!mine.done&&!mine.out)?mine:(players.find(q=>q!==mine&&!q.out&&!q.done)||mine);
  }else p=alive.find(q=>!q.done)||alive[0]||players[0];
  if(!p)return [{x:0,w:W,cam:0}];
  return [{x:0,w:W,cam:camFor(p,W)}];
}
function drawWorld(){
  const vps=viewports();
  for(const v of vps){
    ctx.save();
    ctx.beginPath();ctx.rect(v.x,0,v.w,H);ctx.clip();
    ctx.translate(v.x,0);
    camX=v.cam;
    drawWorldCore();
    ctx.restore();
  }
  if(vps.length===2)rc(127,0,2,H,'#000');
  camX=vps[0].cam;
  const label=boss?'CHEFE':mode==='inf'?'INFINITO FASE '+lvl:'FASE '+lvl+'/'+TOTAL;
  if(mode==='tut')drawTutBox();
  else txt(label,4,4,'#fff',1);
  if(mode!=='tut')players.forEach((p,i)=>{
    const c=CHARS[p.ch];
    txt(c.name+' VIDAS '+(p.out?0:p.lives)+' MOEDAS '+p.coins,4,14+i*10,c.shirt,1);
  });
  popups.forEach((p,i)=>txt(p.t,W-4,4+i*9,p.c,1,'right'));
  if(!boss&&!clearing&&players.some(p=>p.done)){
    const pend=players.filter(p=>!p.out&&!p.done);
    if(pend.length){
      rc(40,96,176,22,'rgba(0,0,0,.7)');
      txt('ESPERANDO '+pend.map(p=>'P'+(p.i+1)).join(' E '),W/2,103,'#ffd23f',1,'center');
    }
  }
  if(bossMsg){
    rc(16,70,224,96,'rgba(0,0,0,.85)');
    txt('PARA DAR DANO NO GORVAX,',W/2,82,'#ffd23f',1,'center');
    txt('DÊ UM MEGA PULO NA CABEÇA DELE',W/2,96,'#fff',1,'center');
    rc(92,122,72,22,'#ffd23f');rc(94,124,68,18,'#7a1f2b');
    txt('AVANÇAR',W/2,131,'#fff',1,'center');
    txt(net.role==='guest'?'AGUARDANDO O ANFITRIÃO':'APERTE A OU ENTER',W/2,156,'#ddd',1,'center');
  }
  if(introT>0){
    rc(24,84,208,50,'rgba(0,0,0,.75)');
    txt(boss?'CHEFE: GORVAX':'FASE '+lvl,W/2,94,'#ffd23f',2,'center');
    txt(levelName(lvl),W/2,116,'#fff',1,'center');
    if(boss)txt('PULE 2X PARA DAR DANO',W/2,126,'#fff',1,'center');
  }
  if(clearing){
    rc(40,96,176,30,'rgba(0,0,0,.7)');
    if(boss)txt('CHEFE DERROTADO!',W/2,106,'#ffd23f',1,'center');
    else txt('FASE LIMPA!',W/2,106,'#ffd23f',2,'center');
  }
}
function renderInner(){
  document.getElementById('tp').style.display=(TOUCH&&(state==='play'||state==='pause'))?'flex':'none';
  if(state==='text')placeTi();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
  if(state==='title')return drawTitle();
  if(state==='ask')return drawAsk();
  if(state==='text')return drawText();
  if(state==='net')return drawNet();
  if(state==='lobby')return drawLobby();
  if(state==='hwait')return drawHwait();
  if(state==='wait')return drawWait();
  if(state==='gsel')return drawGsel();
  if(state==='pause'){
    if(L)drawWorld();
    drawPause();
    return;
  }
  if(state==='options')return drawOptions();
  if(state==='select')return drawSelect();
  if(state==='modes')return drawModes();
  if(state==='levels'){
    if(net.role==='guest'){
      rc(0,0,W,H,'#000');txt('O ANFITRIÃO ESTÁ ESCOLHENDO A FASE...',W/2,H/2,'#fff',1,'center');
      return;
    }
    return drawLevels();
  }
  if(state==='over'){
    rc(0,0,W,H,'#000');
    txt('FIM DE JOGO',W/2,H/2-10,'#e63946',2,'center');
    txt('ENTER VOLTA AO MENU',W/2,H/2+14,'#fff',1,'center');
    return;
  }
  if(state==='win'){
    drawBG(true);
    txt('VOCÊ VENCEU!',W/2,70,'#ffd23f',2,'center');
    txt('GORVAX FOI DERROTADO.',W/2,106,'#fff',1,'center');
    txt('LIRA E PIRA SALVARAM O REINO!',W/2,120,'#fff',1,'center');
    return;
  }
  if(!L){rc(0,0,W,H,'#000');txt('CONECTANDO...',W/2,H/2,'#fff',1,'center');return;}
  drawWorld();
}

function render(){
  renderInner();
}

/* ---------- LOOP ---------- */
let last=0,acc=0;
function loop(t){
  if(!last)last=t;
  acc+=Math.min(100,t-last);
  last=t;
  const step=1000/60;
  while(acc>=step){update();acc-=step;}
  if(net.role==='host'&&net.conn&&net.conn.open)net.conn.send(snapshot());
  render();
  requestAnimationFrame(loop);
}
if(TOUCH)document.body.classList.add('touch');
requestAnimationFrame(loop);
</script>
